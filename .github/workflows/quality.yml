name: Quality

on:
  push:
    branches: [main, opencode/phase0-work]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Unit and integration tests
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint (diagnostic, baseline red - CF-011)
        continue-on-error: true
        run: bun run lint

      - name: Production build (diagnostic, needs env/secrets)
        continue-on-error: true
        run: bun run build